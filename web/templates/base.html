<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}The Falsifier{% endblock %}</title>
<style>
  :root {
    --ink: #16161a;
    --muted: #6b6b76;
    --line: #e2e2e6;
    --bg: #fbfbfc;
    --card: #ffffff;
    --challenge: #b3261e;
    --support: #1e6b3a;
    --unsettled: #8a6500;
    --accent: #2f4f8f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #e8e8ea; --muted: #9a9aa4; --line: #2c2c33;
      --bg: #141417; --card: #1b1b20;
      --challenge: #ef7a72; --support: #6cc38d; --unsettled: #d9ae4a;
      --accent: #8fabe0;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 52rem; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
  @media (min-width: 40rem) { .wrap { padding: 2rem 1.25rem 5rem; } }
  header { border-bottom: 1px solid var(--line); margin-bottom: 2rem; }
  header .wrap { padding-bottom: 1rem; padding-top: 1.5rem; }
  h1 { font-size: 1.35rem; margin: 0 0 .25rem; letter-spacing: -.01em; }
  h2 { font-size: 1.05rem; margin: 2rem 0 .75rem; }
  a { color: var(--accent); }
  nav a { margin-right: 1rem; font-size: .9rem; }
  .sub { color: var(--muted); font-size: .9rem; margin: 0; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 1.1rem 1.25rem; margin-bottom: .9rem;
  }
  .card h3 { margin: 0 0 .4rem; font-size: 1rem; font-weight: 600; }
  blockquote {
    margin: .8rem 0; padding: .7rem 1rem; border-left: 3px solid var(--line);
    background: var(--bg); font-size: .95rem;
  }
  .tag {
    display: inline-block; font-size: .72rem; font-weight: 600;
    letter-spacing: .04em; text-transform: uppercase;
    padding: .18rem .5rem; border-radius: 999px; border: 1px solid currentColor;
  }
  .challenges { color: var(--challenge); }
  .supports { color: var(--support); }
  .unverifiable { color: var(--unsettled); }
  .retracted { opacity: .55; }
  .retracted .card { border-style: dashed; }
  .meta { color: var(--muted); font-size: .84rem; }
  table { border-collapse: collapse; width: 100%; font-size: .9rem; }
  th, td { text-align: left; padding: .45rem .6rem; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; font-size: .8rem;
       text-transform: uppercase; letter-spacing: .04em; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  pre { overflow-x: auto; font-size: .82rem; line-height: 1.5;
        background: var(--card); border: 1px solid var(--line);
        border-radius: 8px; padding: 1rem; }
  .banner {
    background: var(--card); border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    padding: .7rem 1rem; border-radius: 6px; font-size: .88rem;
    margin-bottom: 1.5rem; color: var(--muted);
  }
  .empty { color: var(--muted); padding: 2rem 0; }
  .funnel-step { display: flex; align-items: baseline; gap: .8rem; margin: .3rem 0; }
  .funnel-bar { height: 10px; background: var(--accent); border-radius: 3px; opacity: .75; }
  .funnel-n { font-variant-numeric: tabular-nums; min-width: 3.5rem;
              text-align: right; font-weight: 600; }
  .funnel-label { color: var(--muted); font-size: .88rem; }
  @media (max-width: 34rem) {
    .funnel-step { flex-wrap: wrap; }
    .funnel-bar { order: 3; flex-basis: 100%; }
    .funnel-label { font-size: .82rem; }
    table { font-size: .82rem; }
    th, td { padding: .4rem .35rem; }
    blockquote { padding: .6rem .7rem; font-size: .9rem; }
  }
  .hero { margin-bottom: 1.75rem; }
  .lede { font-size: 1.12rem; line-height: 1.55; margin: 0 0 .9rem;
          letter-spacing: -.005em; }
  .lede-sub { color: var(--muted); font-size: .96rem; margin: 0; }
  .ask { margin: 0 0 .8rem; }
  .ask label { display: block; font-size: .88rem; color: var(--muted);
               margin-bottom: .4rem; }
  .ask textarea {
    width: 100%; padding: .7rem .8rem; border-radius: 8px; resize: vertical;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    font: inherit; font-size: 1rem;
  }
  .ask-row { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center;
             margin-top: .6rem; }
  button {
    font: inherit; font-weight: 600; cursor: pointer; border-radius: 8px;
    padding: .55rem 1.1rem; border: 1px solid var(--accent);
    background: var(--accent); color: #fff;
  }
  button.link {
    background: none; border: none; color: var(--accent); padding: 0;
    font-weight: 400; font-size: .84rem; text-decoration: underline;
    text-align: left;
  }
  .examples { margin-bottom: 2rem; line-height: 1.9; }
</style>
</head>
<body>
<header><div class="wrap">
  <h1><a href="/" style="color:inherit;text-decoration:none">The Falsifier</a></h1>
  <p class="sub">Keeps your plans honest against a world that moves.</p>
  <nav><a href="/">Check something</a><a href="/numbers">What it costs</a></nav>
</div></header>
<div class="wrap">
{% if demo %}
<div class="banner">
  Public demo. Nothing personal is shown or kept here. Try a claim of your
  own — it runs for real, against live sources.
</div>
{% endif %}
{% block body %}{% endblock %}
</div>
</body>
</html>
